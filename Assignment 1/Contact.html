<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CARE HOSPITALS - Contact Us</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background: #0066cc;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      letter-spacing: 1px;
    }
    nav {
      display: flex;
      justify-content: center;
      background: #004080;
    }
    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s;
    }
    nav a:hover {
      background: #00264d;
    }
    nav a.active {
      background: #00264d;
    }
    section {
      padding: 40px 20px;
      text-align: center;
      max-width: 800px;
      margin: auto;
    }
    section h1 {
      color: #004080;
      margin-bottom: 10px;
    }
    section p {
      font-size: 1.1em;
      margin-bottom: 30px;
    }
    section img {
      width: 200px;
      height: auto;
      margin-bottom: 30px;
    }
    form {
      max-width: 500px;
      margin: auto;
      text-align: left;
    }
    form input, form textarea, form button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
    }
    form button {
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    form button:hover {
      background: #004080;
    }
    footer {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 0.9em;
      margin-top: 40px;
    }
    @media (max-width:600px){
      nav {flex-direction: column;}
    }
  </style>
</head>
<body>
  <header>CARE HOSPITALS</header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
  </nav>
  <section>
    <h1>Contact Us</h1>
    <p>Have questions or need to get in touch with us? Fill out the form below and we'll respond promptly.</p>
    <img src="C:\Users\sarth\OneDrive\Desktop\Sem 5\WTL\A 1\assets\clinic_hero.png" alt="CARE HOSPITALS Logo">
    <form>
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </section>
  <footer>© 2026 CARE HOSPITALS. All rights reserved.</footer>

  <script>
    // Set current year in footer
    document.querySelector("footer").innerHTML =
      "&copy; " + new Date().getFullYear() + " CARE HOSPITALS. All rights reserved.";

    // Highlight active nav link (Contact is index 3)
    let links = document.querySelectorAll("nav a");
    links[3].classList.add("active");

    // Form validation on submit
    let form = document.querySelector("form");
    form.addEventListener("submit", function(e) {
      let name = document.querySelector("input[name='name']").value.trim();
      let email = document.querySelector("input[name='email']").value.trim();
      let message = document.querySelector("textarea[name='message']").value.trim();

      if (name === "" || email === "" || message === "") {
        alert("Please fill in all fields before submitting.");
        e.preventDefault();
      } else if (!email.includes("@") || !email.includes(".")) {
        alert("Please enter a valid email address.");
        e.preventDefault();
      } else {
        alert("Thank you, " + name + "! Your message has been sent successfully.");
      }
    });

    console.log("Contact CARE HOSPITALS - We're here to help you.");
  </script>
</body>
</html>
